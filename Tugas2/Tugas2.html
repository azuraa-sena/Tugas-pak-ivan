<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 - Form Input</title>
    <link rel="stylesheet" type="text/css" href="form.css">
    <!-- Font Google Poppins agar tampilan lebih modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card-form">
        <h2>Form Data Mahasiswa</h2>

        <form action="" method="post">
            
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>

            <div class="form-group">
                <label for="jurusan">Jurusan</label>
                <select id="jurusan" name="jurusan">
                    <option value="">-- Pilih Jurusan --</option>
                    <option value="TI">Teknologi Informasi</option>
                    <option value="IK">Ilmu Komputer</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jenis Kelamin</label>
                <div class="radio-box">
                    <label><input type="radio" name="jk" value="L"> Laki-laki</label>
                    <label><input type="radio" name="jk" value="P"> Perempuan</label>
                </div>
            </div>

            <div class="form-group">
                <label>Hobi</label>
                <div class="checkbox-box">
                    <label><input type="checkbox" name="hobi[]" value="Coding"> Coding</label>
                    <label><input type="checkbox" name="hobi[]" value="Gaming"> Gaming</label>
                    <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                </div>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat</label>
                <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
            </div>

            <div class="form-group">
                <button type="submit" class="btn-submit">Kirim Data</button>
            </div>
        </form>
    </div>

</body>
</html>
