<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Tugas Pak Ivan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        h1 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #aaaaaa;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        a {
            display: block;
            padding: 12px;
            background-color: #1e1e1e;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #333333;
            transition: 0.2s;
        }

        a:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Tugas Pak Ivan</h1>
        <div class="menu">
            <a href="Tugas1/Tugas1.html">Tugas 1</a>
            <a href="Tugas2/Tugas2.html">Tugas 2</a>

    </div>

</html>
